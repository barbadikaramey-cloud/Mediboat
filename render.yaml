# ── Web service on Render free tier (Root Blueprint) ───────────────────────────
services:
  - type: web
    name: medibot-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health

    # Environment variables configured in Render Dashboard
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: "medibot"
      - key: MODEL_GENERATION
        value: "openai/gpt-oss-120b"
      - key: MODEL_CHEAP
        value: "openai/gpt-oss-20b"